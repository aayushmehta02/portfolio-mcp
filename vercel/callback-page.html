<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connecting to Upstox…</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: #f9fafb;
      color: #111827;
    }
    .card {
      text-align: center;
      padding: 48px 40px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      max-width: 400px;
    }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid #e5e7eb;
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 24px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h2 { margin: 0 0 8px; font-size: 1.25rem; }
    p  { margin: 0; color: #6b7280; font-size: 0.9rem; }
    .error { color: #ef4444; }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner" id="spinner"></div>
    <h2 id="title">Connecting to Upstox…</h2>
    <p  id="subtitle">Hang on, this takes just a second.</p>
  </div>

  <script>
    const params    = new URLSearchParams(window.location.search);
    const code      = params.get("code");       // Upstox
    const auth_code = params.get("auth_code");  // Fyers
    const token     = code || auth_code;        // whichever broker
    const paramKey  = auth_code ? "auth_code" : "code";
    const state     = params.get("state");
    const error     = params.get("error");

    function showError(msg) {
      document.getElementById("spinner").style.display = "none";
      document.getElementById("title").textContent = "Connection failed";
      document.getElementById("subtitle").innerHTML =
        `<span class="error">${msg}</span>`;
    }

    if (error) {
      showError("Broker denied access: " + error);
    } else if (token && state && state.startsWith("http://localhost")) {
      // Forward the auth code to the local MCP server
      window.location.replace(state + "?" + paramKey + "=" + encodeURIComponent(token));
    } else if (token && !state) {
      showError("Session mismatch. Please try connecting again from Claude.");
    } else {
      document.getElementById("spinner").style.display = "none";
      document.getElementById("title").textContent = "Portfolio MCP";
      document.getElementById("subtitle").textContent =
        "Connect your brokers via Claude to get started.";
    }
  </script>
</body>
</html>
