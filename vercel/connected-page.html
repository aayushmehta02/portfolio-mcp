<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connected!</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: #f9fafb;
      color: #111827;
    }
    .card {
      text-align: center;
      padding: 48px 40px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      max-width: 400px;
    }
    .icon { font-size: 3rem; margin-bottom: 16px; }
    h2 { margin: 0 0 8px; font-size: 1.25rem; color: #10b981; }
    p  { margin: 0; color: #6b7280; font-size: 0.9rem; line-height: 1.5; }
    .error h2 { color: #ef4444; }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="icon">✅</div>
    <h2>You're connected!</h2>
    <p>Your Upstox account is linked.<br>You can close this tab and return to Claude.</p>
  </div>

  <script>
    const error = new URLSearchParams(window.location.search).get("error");
    if (error) {
      document.getElementById("card").classList.add("error");
      document.querySelector(".icon").textContent = "❌";
      document.querySelector("h2").textContent = "Connection failed";
      document.querySelector("p").textContent =
        "Something went wrong: " + error + ". Please try again from Claude.";
    }
  </script>
</body>
</html>
