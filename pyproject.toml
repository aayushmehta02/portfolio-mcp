[project]
name = "portfolio-mcp"
version = "0.1.0"
description = "AI-powered portfolio intelligence MCP server for Indian retail investors"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "cryptography>=46.0.7",
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
    "lxml>=5.0.0",
    "mcp>=1.27.0",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.14.0",
    "python-dotenv>=1.2.2",
    "upstox-python-sdk>=2.24.0",
    "fyers-apiv3>=3.0.0",
    "uvicorn[standard]>=0.46.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/portfolio_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
